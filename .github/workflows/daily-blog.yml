name: Publish scheduled blog articles

# Articles live in content/blog/*.json with a publication date.
# Every day this job rebuilds the site; articles dated today or earlier go live,
# later ones stay unpublished. 04:13 UTC = 07:13 in Riyadh.
on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build blog, feeds and sitemap
        run: python3 scripts/build_blog.py
      - name: Check site
        run: python3 scripts/check_site.py
      - name: Commit and push if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "blog-publisher"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Publish scheduled blog article ($(date -u +%F))"
            git push origin HEAD:main
          else
            echo "Nothing to publish today."
          fi
